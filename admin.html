<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKLAV MODZ - Admin Dashboard</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif; }
        body { background:#0a0b10; color:#fff; padding:20px; }
        h1 { margin-bottom:20px; color:#6b52ff; }
        .order-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            padding:18px;
            margin-bottom:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
        }
        .btn-approve {
            background:#2ed573; color:#000; font-weight:bold; border:none; padding:10px 18px; border-radius:6px; cursor:pointer;
        }
        .btn-approved {
            background:#57606f; color:#ccc; cursor:not-allowed; border:none; padding:10px 18px; border-radius:6px;
        }
    </style>
</head>
<body>

    <h1>EKLAV MODZ - Admin Approval Panel</h1>
    <div id="adminOrdersList"></div>

    <script>
        function loadAdminOrders() {
            const list = document.getElementById('adminOrdersList');
            let orders = JSON.parse(localStorage.getItem('eklav_orders') || '[]');
            list.innerHTML = '';

            if(orders.length === 0) {
                list.innerHTML = '<p>No pending or submitted tickets.</p>';
                return;
            }

            orders.reverse().forEach(o => {
                list.innerHTML += `
                    <div class="order-card">
                        <div>
                            <h3>${o.plan} - (${o.price} INR)</h3>
                            <p><strong>UTR:</strong> ${o.utr}</p>
                            <p><strong>Key to Assign:</strong> ${o.key}</p>
                            <p><strong>Validity:</strong> ${o.validity}</p>
                            <small style="color:#aaa;">Date: ${o.date}</small>
                        </div>
                        <div>
                            ${o.status === 'Pending' 
                                ? `<button class="btn-approve" onclick="approveOrder(${o.id})">Approve Order</button>` 
                                : `<button class="btn-approved" disabled>Approved ✓</button>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        function approveOrder(id) {
            let orders = JSON.parse(localStorage.getItem('eklav_orders') || '[]');
            orders = orders.map(o => {
                if(o.id === id) o.status = 'Approved';
                return o;
            });
            localStorage.setItem('eklav_orders', JSON.stringify(orders));
            loadAdminOrders();
            alert('Order Approved Successfully! Key sent to User Purchase History.');
        }

        loadAdminOrders();
    </script>
</body>
</html>
