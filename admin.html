<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EKLAV MODZ | Admin Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #0b0714; color: #fff; font-family: sans-serif; padding: 20px; }
        h2 { color: #a855f7; margin-bottom: 20px; }
        .ticket-card { background: #130d24; border: 1px solid #a855f7; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .btn { padding: 8px 14px; border: 0; border-radius: 6px; cursor: pointer; font-weight: bold; margin-right: 8px; }
        .btn-approve { background: #22c55e; color: #000; }
        .btn-disapprove { background: #ef4444; color: #fff; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
        .pending { background: #eab308; color: #000; }
        .approved { background: #22c55e; color: #000; }
        .disapproved { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <h2>Admin Approval Dashboard</h2>
    <div id="ticketContainer">Loading Tickets...</div>

    <script>
        const firebaseConfig = { databaseURL: "https://your-firebase-db-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        db.ref('tickets').on('value', snapshot => {
            const container = document.getElementById('ticketContainer');
            container.innerHTML = '';
            const data = snapshot.val();

            if(!data) { container.innerHTML = 'Koi Order Nahi Hai.'; return; }

            Object.keys(data).reverse().forEach(key => {
                const item = data[key];
                const card = document.createElement('div');
                card.className = 'ticket-card';
                card.innerHTML = `
                    <p><strong>Name:</strong> ${item.name}</p>
                    <p><strong>Plan:</strong> ${item.plan} (₹${item.price})</p>
                    <p><strong>UTR:</strong> ${item.utr}</p>
                    <p><strong>Time:</strong> ${item.time}</p>
                    <p><strong>Status:</strong> <span class="badge ${item.status}">${item.status.toUpperCase()}</span></p>
                    ${item.key ? `<p><strong>Key:</strong> ${item.key}</p>` : ''}
                    <div style="margin-top:10px;">
                        <button class="btn btn-approve" onclick="approveTicket('${item.id}')">Approve</button>
                        <button class="btn btn-disapprove" onclick="disapproveTicket('${item.id}')">Disapprove</button>
                    </div>
                `;
                container.appendChild(card);
            });
        });

        function approveTicket(id) {
            const keyGen = "EKLAV-KEY-" + Math.random().toString(36).substring(2, 8).toUpperCase();
            db.ref('tickets/' + id).update({
                status: 'approved',
                key: keyGen
            });
        }

        function disapproveTicket(id) {
            db.ref('tickets/' + id).update({
                status: 'disapproved',
                key: 'REJECTED / INVALID UTR'
            });
        }
    </script>
</body>
</html>
